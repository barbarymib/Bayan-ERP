name: bayan

services:
  postgres:
    image: postgis/postgis:17-3.4
    container_name: bayan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bayan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayan}
      POSTGRES_DB: ${POSTGRES_DB:-bayan}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bayan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bayan-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # F3: تخزين الكائنات (أرشيفات + نسخ احتياطية) — خادم S3 محلي متوافق مع MinIO.
  # يُفعَّل في التطبيق عبر STORAGE_DRIVER=s3 مع MINIO_ENDPOINT=localhost.
  # ملاحظة: MinIO الأصلي أُرشِف وأزيلت صوره من Docker Hub ثم quay.io (2026)
  # — نعتمد شوكة pgsty/silo النشطة (نفس المتغيرات والأمر وسجل البيانات).
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: bayan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # G28: خدمات التطبيق (profile «apps») — التشغيل الافتراضي للبنية فقط كما كان؛
  # للتشغيل الكامل: docker compose --profile apps up --build
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    container_name: bayan-api-migrate
    environment: &api-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-bayan}:${POSTGRES_PASSWORD:-bayan}@postgres:5432/${POSTGRES_DB:-bayan}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bayan}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bayan12345}
      S3_BUCKET: ${S3_BUCKET:-bayan}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["apps"]

  # إنشاء مستخدم تطبيق مخصص في MinIO (API يرفض اعتمادات minioadmin الافتراضية
  # في وضع production) + ضمان وجود الـ bucket.
  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: bayan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bayan}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bayan12345}
      S3_BUCKET: ${S3_BUCKET:-bayan}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
        mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY" || mc admin policy set local readwrite --user "$$S3_ACCESS_KEY" || true
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "minio-init ok"
    profiles: ["apps"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: bayan-api
    environment: *api-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["apps"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: bayan-web
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["apps"]

volumes:
  pgdata:
  redisdata:
  miniodata:
